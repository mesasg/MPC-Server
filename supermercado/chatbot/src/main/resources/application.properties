spring.application.name=supermercado-chatbot

# Las claves se leen del archivo .env de la raiz del repositorio (ver .env.example).
# La segunda ruta cubre los IDE que ejecutan desde la raiz en lugar de desde este modulo.
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]

server.address=127.0.0.1
server.port=8081

# La clave viene de .env o del entorno: GOOGLE_API_KEY o GEMINI_API_KEY.
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:${GEMINI_API_KEY:}}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash}
spring.ai.google.genai.chat.options.temperature=0.2

# Cliente MCP: descubre las herramientas del servidor del supermercado al arrancar.
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.supermercado.url=${MCP_URL:http://localhost:8090}
spring.ai.mcp.client.streamable-http.connections.supermercado.endpoint=/mcp

logging.level.root=INFO
