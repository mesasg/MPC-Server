spring.application.name=supermercado-mcp

# Las claves se leen del archivo .env de la raiz del repositorio (ver .env.example).
# La segunda ruta cubre los IDE que ejecutan desde la raiz en lugar de desde este modulo.
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]

spring.ai.mcp.server.name=supermercado-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# Solo acepta conexiones del propio equipo: el endpoint MCP no tiene autenticacion.
server.address=127.0.0.1
server.port=8090

spring.datasource.url=jdbc:mysql://localhost:3306/supermercado_mcp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.file.name=./logs/supermercado-mcp.log
logging.level.root=INFO
