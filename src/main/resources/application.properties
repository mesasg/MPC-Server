spring.application.name=labmcp

# Las claves se leen del archivo .env de la raiz del repositorio (ver .env.example).
spring.config.import=optional:file:.env[.properties]

spring.ai.mcp.server.name=tarea-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

spring.ai.mcp.server.stdio=false

server.port=8088

logging.file.name=./logs/labmcp.log
logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG

spring.datasource.url=jdbc:mysql://localhost:3306/labmcp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


